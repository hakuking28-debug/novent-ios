name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      ipa_name:
        description: "Artifact name"
        required: false
        default: "Novent-unsigned"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: target

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install dependencies
        working-directory: target
        run: npm install

      - name: Expo prebuild
        working-directory: target
        run: npx expo prebuild --platform ios --non-interactive

      - name: CocoaPods
        working-directory: target/ios
        run: pod install --repo-update

      - name: Build unsigned app
        working-directory: target
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          PROJECT=$(ls -d ios/*.xcodeproj | head -n1)
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES build

      - name: Package IPA
        working-directory: target
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -maxdepth 2 -name "*.app" -type d | head -n1)
          test -n "$APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r "${{ inputs.ipa_name }}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.ipa_name }}
          path: target/build/${{ inputs.ipa_name }}.ipa
          retention-days: 14
